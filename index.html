<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Age Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="wrapper">

        <div class="container">

            <h1>Age Calculator</h1>

            <div class="enterDate">

                <span>Enter your Date of Birth</span>
                <br>
                <br>

                <input type="date" name="" class="inputDob">

            </div>
            <br>
            <div class="currentDate">

                <span>Enter current Date</span>
                <br>
                <br>

                <input type="date" name="" class="currentDateInput">

            </div>
            <br>

            <button type="button" class="getAge" onclick="getDob()">Calculate</button>

            <div class="displayAge"><strong> </strong></div>
        </div>
    </div>

</body>
<script src="script.js"></script>

</html>
